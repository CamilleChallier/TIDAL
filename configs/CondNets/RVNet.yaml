# --- paths ---
logging_dir: outputs/RVNet
data_dir:   /store/usagers/livazra/Nav_dataset/
name:        RVNet_MAE_run

# --- runtime ---
gpu_idx:     "1"
num_workers: 8
seed:        123

# --- data ---
nb_inputs:   3
tp:          1
vol_size: [32, 64, 64]

# --- training ---
vae_epochs: 200
lr_vae:      5e-5
batch_size:  16

# Optimizer
optimizer:    adamw
weight_decay: 5.0e-3    # increase from 1e-3

# Scheduler
scheduler:       cosine         # was plateau
cosine_t_max:    200
cosine_eta_min:  1.0e-7

# Early stopping
early_stopping_patience: 20
early_stopping_delta:    1e-4

kl_warmup_epochs: 10   # ramp KL weight from 0 → target over first 10 epochs

# Model
rvnet_enc_channels: [16, 32, 64]
rvnet_pre_latent_dim: 64

rvnet_patch_size:      4             # MAE/SimMIM/SparK patch size (cubic); must equal 2^nb_convs for SparK
rvnet_mask_ratio:      0.7          # fraction of patches masked
rvnet_mask_warmup_epochs: 0          # epochs to ramp mask_ratio 0 → target
rvnet_dec_width:       64            # SparK decoder starting width (halved per encoder scale)