# ============================================================
#  MambaMorph training — ACDC cardiac dataset (from scratch)
#  Standalone config for train_MambaMorph_ACDC.py
#  Run in the `mamba` conda env (mamba_ssm CUDA extension), not `mopred`.
# ============================================================

# --- paths ---
logging_dir: /store/usagers/p123507/MoPred/outputs/Mambamorph_ACDC
data_dir:    /volatile/data/cam/ACDC/database
name:        mambamorph_acdc_run

checkpoint:  ""             # set to resume from an existing MM checkpoint

# --- runtime ---
gpu_idx:     "0"
num_workers: 12
seed:        123

# --- training ---
epochs:       100
lr:           5e-5
batch_size:   8          # ACDC CANONICAL_SHAPE is (32,128,128) — 4x the spatial area of the
                          # liver's (32,64,64), so batch size is dropped from mambamorph_liver.yaml's
                          # 8 to fit memory; raise if your GPU has headroom
weight_decay: 1.0e-4      # same starting point as mambamorph_liver.yaml (MambaMorph is ~18x
                          # VoxelMorph's param count on the same data and needs more regularization
                          # than voxelmorph_acdc.yaml) — the liver run's specific overfitting epoch
                          # was not re-verified on ACDC, so watch val_loss and retune if needed

scheduler_patience:      6      # ReduceLROnPlateau patience (epochs)
early_stopping_patience: 15
early_stopping_delta:    1e-4

# --- MambaMorph objective ---
# loss = ncc_as_loss(warped, fixed) + lam_smooth * gradient_loss(dvf)
# (no edge term here — train_MambaMorph_ACDC.py mirrors train_VoxelMorph_ACDC.py's
# loss, unlike the liver script, which adds lam_edge * laplacian_edge_loss(...))
lam_smooth: 1.0
lam_edge:   0.05

# --- optional: downsample ACDC volumes to the liver pipeline's (32,64,64) shape ---
# Set true only if you want an ACDC-trained checkpoint that's shape-compatible
# with the liver pipeline (e.g. for --dataset liver cross-evaluation downstream).
downsample_to_liver: True

# --- frequency-aware encoder/skip blocks (Shi et al., ALPF/AHPF) ---
mambamorph_freq_aware: True
mambamorph_patch_size: 2

reference_slices_path : mopred/data/reference_slices.csv

mambamorph_embed_dim : 48
