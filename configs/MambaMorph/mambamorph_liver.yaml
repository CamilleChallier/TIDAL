# ============================================================
#  MambaMorph training — liver respiratory navigator dataset (from scratch)
#  Standalone config for train_MambaMorph_liver.py
#  Run in the `mamba` conda env (mamba_ssm CUDA extension), not `mopred`.
# ============================================================

# --- paths ---
logging_dir: /store/usagers/p123507/MoPred/outputs/MambaMorph
data_dir:    /store/usagers/livazra/Nav_dataset/
name:        mambamorph_liver_run

checkpoint:  ""             # set to resume from an existing MM checkpoint

# --- runtime ---
gpu_idx:     "1"
num_workers: 12
seed:        123

# --- training ---
epochs:       100
lr:           5e-5
batch_size:   16        
weight_decay: 1.0e-4    

scheduler_patience:      6      # ReduceLROnPlateau patience (epochs)
early_stopping_patience: 15
early_stopping_delta:    1e-4

# --- MambaMorph objective ---
# loss = ncc_as_loss(warped, fixed) + lam_smooth * gradient_loss(dvf) + lam_edge * laplacian_edge_loss(warped, fixed)
lam_smooth: 0.1
lam_edge:   0.05

# --- frequency-aware encoder/skip blocks (Shi et al., ALPF/AHPF) ---
mambamorph_freq_aware: True
mambamorph_patch_size: 2


mambamorph_embed_dim : 48